version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: uav-twin-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - twin-net

  frontend:
    build:
      context: ./frontend
    container_name: uav-twin-gcs
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - twin-net

networks:
  twin-net:
    driver: bridge
